name: Windows build and smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test shared reading engine
        run: |
          node tests/engine.test.cjs
          node tests/storage.test.cjs
          python tests/theme_contrast.test.py
      - name: Generate shared reading interface
        run: python scripts/make_web.py
      - name: Build Windows app
        run: dotnet publish src/windows/QuietRead.csproj -c Release -r win-x64 --self-contained true -o build/windows
      - name: Smoke test Windows app and WebView storage
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path build/windows/QuietRead.exe) -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw "Smoke test failed: $($app.ExitCode)" }
      - name: Package portable app
        shell: pwsh
        run: |
          Copy-Item LICENSE build/windows/LICENSE.txt
          Compress-Archive -Path build/windows/* -DestinationPath QuietRead-Windows-x64.zip
          (Get-FileHash QuietRead-Windows-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii QuietRead-Windows-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: QuietRead-Windows-x64
          path: |
            QuietRead-Windows-x64.zip
            QuietRead-Windows-x64.sha256
          if-no-files-found: error
